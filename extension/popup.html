<!DOCTYPE html>

<html>

<head>

  <title>Personal LinkedIn Copilot</title>

  <style>

    body {
      width: 300px;

      margin: 0;

      padding: 18px;

      font-family:
        Arial,
        sans-serif;

      color: #111827;
    }

    h3 {
      margin-top: 0;

    p {

      color: #6b7280;

    }

<body>

  <h3>
    Personal LinkedIn Copilot

  <p>

  </button>

  <div id="status"></div>

  <script src="popup.js"></script>

</html>
